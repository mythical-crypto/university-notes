name: Train CIFAR-10 transfer learning model
on:
  push:
    paths:
      - '.github/workflows/train-cifar10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "tensorflow-cpu==2.19.1" "numpy<2.1" scikit-learn matplotlib pillow
      - name: Execute training and evaluation
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "2"
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "4"
        run: |
          python -u train_transfer_learning.py 2>&1 | tee train.log
      - name: Publish trained model, figures and metrics
        if: success()
        run: |
          mkdir -p results
          cp transfer_learning_lab/artifacts/metrics.json results/
          cp transfer_learning_lab/artifacts/classification_report.txt results/
          cp transfer_learning_lab/artifacts/SUMMARY.md results/
          cp transfer_learning_lab/artifacts/*.png results/
          cp transfer_learning_lab/artifacts/mobilenetv2_cifar3.h5 results/
          cp transfer_learning_lab/artifacts/dataset_100_per_class.zip results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Add verified training metrics and trained model" || exit 0
          git push origin HEAD:main
