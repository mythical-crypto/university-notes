name: Evaluate published Teachable Machine model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless browser and evaluation dependencies
        run: |
          python -m pip install --no-cache-dir playwright scikit-learn matplotlib numpy pillow
          python -m playwright install chromium
      - name: Evaluate ALL held-out photos against hosted model
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python -u 05_Source_Code/03_Проверка_Teachable_Machine.py
      - name: Publish verified held-out accuracy and confusion matrix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03_Teachable_Machine/02_Метрики_60_фото.json 03_Teachable_Machine/03_Предсказания_60_фото.csv 03_Teachable_Machine/04_Матрица_ошибок.png
          git commit -m 'Publish 60-image public Teachable Machine evaluation' || exit 0
          git push origin HEAD:main
      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teachable-machine-heldout-evaluation
          path: |
            03_Teachable_Machine/02_Метрики_60_фото.json
            03_Teachable_Machine/03_Предсказания_60_фото.csv
            03_Teachable_Machine/04_Матрица_ошибок.png
          retention-days: 30
